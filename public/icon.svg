<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Rich Emerald Depth) -->
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Inner Glow / Highlight -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- M Letter Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Drop Shadow for M -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="120"
    ry="120"
    fill="url(#emeraldBg)"
  />

  <!-- Subtle Inner Border Highlight -->
  <rect
    x="18"
    y="18"
    width="476"
    height="476"
    rx="118"
    ry="118"
    fill="none"
    stroke="url(#innerGlow)"
    stroke-width="4"
  />

  <!-- Distinctive, Clean Architectural "M" Geometry -->
  <g filter="url(#shadow)">
    <path
      d="M 124 372
         L 124 160
         C 124 148 136 140 147 146
         L 246 250
         C 252 256 260 256 266 250
         L 365 146
         C 376 140 388 148 388 160
         L 388 372
         C 388 381 381 388 372 388
         L 344 388
         C 335 388 328 381 328 372
         L 328 228
         L 272 288
         C 263 298 249 298 240 288
         L 184 228
         L 184 372
         C 184 381 177 388 168 388
         L 140 388
         C 131 388 124 381 124 372 Z"
      fill="url(#letterGrad)"
    />

    <!-- Glowing Accent Node on the apex -->
    <circle
      cx="256"
      cy="136"
      r="16"
      fill="#a7f3d0"
    />
  </g>
</svg>
